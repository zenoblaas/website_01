<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zeno blaas</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #text {
        font-family: Menlo, Monaco, monospace;
        color: #7cff00;
        font-size: 12pt;
        white-space: pre;
        background: none;
        border: none;
        cursor: pointer;
        text-align: left;
        line-height: 1.6;
        padding: 0;
      }
      #text:hover {
        font-style: italic;
      }
      #text.contact {
        font-size: 7pt;
      }
      #photo {
        position: fixed;
        display: none;
        cursor: pointer;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <button id="text">zeno blaas</button>
    <img id="photo" alt="" draggable="false" />
    <script>
      const button = document.getElementById("text");
      const photo = document.getElementById("photo");

      // Randomly pick one of "00_img/img_1.jpg", "00_img/img_2.jpg", ...
      // Set the count below to how many images the folder contains.
      const IMG_COUNT = 5;
      function randomImage() {
        const n = 1 + Math.floor(Math.random() * IMG_COUNT);
        return "00_img/img_" + n + ".jpg";
      }
      const defaultText = "zeno blaas";
      const contactText =
        "adr.:\tm\u00fcnchen\n" +
        "tel.:\t+39 371 121 4528\n" +
        "mail:\tzeno.blaas@proton.me";
      let showingContact = false;

      button.addEventListener("click", () => {
        showingContact = !showingContact;
        if (showingContact) {
          button.textContent = contactText;
          button.classList.add("contact");
        } else {
          button.textContent = defaultText;
          button.classList.remove("contact");
        }
      });

      document.addEventListener("click", (event) => {
        if (event.target === button || button.contains(event.target)) return;
        if (event.target === photo) {
          photo.style.display = "none";
          return;
        }
        // Position the JPG with the cursor position as its origin (top-left corner)
        photo.src = randomImage();
        // Downscale the image to 10% of its original size
        photo.onload = () => {
          photo.style.width = photo.naturalWidth * 0.1 + "px";
        };
        photo.style.left = event.clientX + "px";
        photo.style.top = event.clientY + "px";
        photo.style.display = "block";
      });
    </script>
  </body>
</html>
